# docker-compose.yml（公式配布物）への上書き設定。
# docker compose up 時に自動で読み込まれる。

# macOS ではホストのディレクトリ（大文字・小文字を区別しないファイルシステム）を
# MySQL のデータディレクトリにバインドマウントすると、lower_case_table_names=2 となり
# マイグレーションが "Got error 168 from storage engine" で失敗する。
# そのため、データディレクトリを名前付きボリュームに置き換える。
volumes:
  db-data:
services:
  mysql:
    volumes:
      - db-data:/var/lib/mysql
