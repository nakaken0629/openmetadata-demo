# docker-compose.yml（公式配布物）への上書き設定。
# docker compose up 時に自動で読み込まれる。

# macOS ではホストのディレクトリ（大文字・小文字を区別しないファイルシステム）を
# MySQL のデータディレクトリにバインドマウントすると、MySQL が
# lower_case_table_names=2 で起動する（Linux 上の通常の動作は 0）。
# 過去にこの構成でマイグレーションが "Got error 168 from storage engine" で失敗した。
# 空のディレクトリからの再検証では失敗は再現せず、原因は特定できていない。
# ファイルシステムの違いによる問題を避けるため、データディレクトリを
# 名前付きボリュームに置き換える。
volumes:
  db-data:
services:
  mysql:
    volumes:
      - db-data:/var/lib/mysql
